name: Folio device upgrade

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Tag to test, such as v0.3.50. Empty tests releases/latest and does not change which release is latest.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/folio-device-upgrade.yml'
      - '.github/scripts/folio_device_drive.py'
  workflow_run:
    workflows: ["Build Folio APK"]
    types: [completed]

permissions:
  contents: read

# A main build is published as a prerelease. This workflow installs that tag.
# releases/latest stays on the last promoted release until both upgrade paths pass.
env:
  CANDIDATE_TAG: ${{ (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && format('v0.3.{0}', github.event.workflow_run.run_number)) || github.event.inputs.candidate_tag || '' }}

jobs:
  upgrade-from-v0233:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the UI driver
        uses: actions/checkout@v4
      - name: Download v0.2.33 and the candidate signed release
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/folio-v0233.apk \
            https://github.com/mohannadzohair456-beep/folio-finance/releases/download/v0.2.33/app-release.apk
          if [ -n "${CANDIDATE_TAG}" ]; then
            candidate_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE_TAG}/app-release.apk"
          else
            candidate_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.apk"
          fi
          echo "Candidate APK: ${candidate_url}"
          curl -fL --retry 3 --output /tmp/folio-current.apk "$candidate_url"
          python3 -c 'import pathlib,sys
          for path in sys.argv[1:]:
              data=pathlib.Path(path).read_bytes()
              if data[:4]!=b"PK\x03\x04": raise SystemExit(path+" is not an apk")
              print(path, len(data))' /tmp/folio-v0233.apk /tmp/folio-current.apk
          sha256sum /tmp/folio-v0233.apk /tmp/folio-current.apk
      - name: Install UI text tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Prepare KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Enter data on v0.2.33, upgrade in place, read it back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048
          disable-animations: true
          emulator-boot-timeout: 720
          script: python3 "$GITHUB_WORKSPACE/.github/scripts/folio_device_drive.py" upgrade --old /tmp/folio-v0233.apk --new /tmp/folio-current.apk --artifacts "$GITHUB_WORKSPACE/emulator-artifacts/upgrade-api34"
      - name: Upload upgrade screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-upgrade-api34
          path: emulator-artifacts/upgrade-api34
          if-no-files-found: warn
          retention-days: 14

  upgrade-from-schema1:
    # Only a main push build has a prerelease tag to install. A pull-request
    # build does not publish, and a push of this file alone still has the
    # previous promoted release as latest.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the UI driver
        uses: actions/checkout@v4
      - name: Download schema 1 (v0.3.46) and the candidate signed release
        run: |
          set -euo pipefail
          # v0.3.46 is the signed schema-1 release. The candidate is the
          # prerelease tag, not releases/latest, because latest stays on the
          # last promoted build until this gate passes.
          curl -fL --retry 3 --output /tmp/folio-schema1.apk \
            https://github.com/mohannadzohair456-beep/folio-finance/releases/download/v0.3.46/app-release.apk
          if [ -z "${CANDIDATE_TAG}" ]; then
            echo "::error::Schema 1 upgrade needs the candidate release tag."
            exit 1
          fi
          candidate_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE_TAG}/app-release.apk"
          echo "Candidate APK: ${candidate_url}"
          curl -fL --retry 3 --output /tmp/folio-current.apk "$candidate_url"
          python3 -c 'import pathlib,sys
          for path in sys.argv[1:]:
              data=pathlib.Path(path).read_bytes()
              if data[:4]!=b"PK\x03\x04": raise SystemExit(path+" is not an apk")
              print(path, len(data))' /tmp/folio-schema1.apk /tmp/folio-current.apk
          sha256sum /tmp/folio-schema1.apk /tmp/folio-current.apk
          if cmp -s /tmp/folio-schema1.apk /tmp/folio-current.apk; then
            echo "::error::The published release is still schema 1 (v0.3.46). This job enters data on that APK and upgrades to a newer signed release."
            exit 1
          fi
      - name: Install UI text tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Prepare KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Enter data on schema 1, upgrade in place, read it back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048
          disable-animations: true
          emulator-boot-timeout: 720
          script: python3 "$GITHUB_WORKSPACE/.github/scripts/folio_device_drive.py" upgrade --old /tmp/folio-schema1.apk --new /tmp/folio-current.apk --expect-old 0.3.46 --artifacts "$GITHUB_WORKSPACE/emulator-artifacts/upgrade-schema1-api34"
      - name: Upload schema-1 upgrade screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-upgrade-schema1-api34
          path: emulator-artifacts/upgrade-schema1-api34
          if-no-files-found: warn
          retention-days: 14

  clean-launch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Checkout the UI driver
        uses: actions/checkout@v4
      - name: Download the candidate signed release
        run: |
          set -euo pipefail
          if [ -n "${CANDIDATE_TAG}" ]; then
            candidate_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE_TAG}/app-release.apk"
          else
            candidate_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.apk"
          fi
          echo "Candidate APK: ${candidate_url}"
          curl -fL --retry 3 --output /tmp/folio-current.apk "$candidate_url"
          python3 -c 'import pathlib,sys; data=pathlib.Path(sys.argv[1]).read_bytes();
          assert data[:4]==b"PK\x03\x04", "not an apk"; print(len(data))' /tmp/folio-current.apk
          sha256sum /tmp/folio-current.apk
      - name: Install UI text tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Prepare KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Clean install and launch on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 "$GITHUB_WORKSPACE/.github/scripts/folio_device_drive.py" launch --apk /tmp/folio-current.apk --artifacts "$GITHUB_WORKSPACE/emulator-artifacts/launch-api${{ matrix.api }}"
      - name: Upload launch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-launch-api${{ matrix.api }}
          path: emulator-artifacts/launch-api${{ matrix.api }}
          if-no-files-found: warn
          retention-days: 14

  # Promotion waits on the two upgrade paths only. A clean-launch failure
  # does not move releases/latest. These jobs do not touch signing.
  promote-release:
    needs: [upgrade-from-v0233, upgrade-from-schema1]
    if: ${{ success() && needs.upgrade-from-v0233.result == 'success' && needs.upgrade-from-schema1.result == 'success' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the tested build to latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_TAG}" ]; then
            echo "::error::No candidate tag to promote."
            exit 1
          fi
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F prerelease=false
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f make_latest=true
          prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" --jq .prerelease)"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "${CANDIDATE_TAG} prerelease=${prerelease} releases/latest=${latest}"
          if [ "$prerelease" != "false" ] || [ "$latest" != "$CANDIDATE_TAG" ]; then
            echo "::error::${CANDIDATE_TAG} was not promoted to latest"
            exit 1
          fi

  withhold-latest-on-failure:
    needs: [upgrade-from-v0233, upgrade-from-schema1]
    if: ${{ failure() && (needs.upgrade-from-v0233.result == 'failure' || needs.upgrade-from-schema1.result == 'failure') && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the failed build as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_TAG}" ]; then
            echo "::error::No candidate tag to mark as a prerelease."
            exit 1
          fi
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F prerelease=true -f make_latest=false
          prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CANDIDATE_TAG}" --jq .prerelease)"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "${CANDIDATE_TAG} prerelease=${prerelease} releases/latest=${latest}"
          if [ "$prerelease" != "true" ] || [ "$latest" = "$CANDIDATE_TAG" ]; then
            echo "::error::${CANDIDATE_TAG} is still latest or is not a prerelease"
            exit 1
          fi
