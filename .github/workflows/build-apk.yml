name: Build Folio APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test transaction parser
        run: |
          mkdir -p /tmp/folio-parser-tests
          javac -d /tmp/folio-parser-tests android/app/src/main/java/com/folio/finance/TransactionParser.java tests/ParserTest.java
          java -cp /tmp/folio-parser-tests ParserTest
      - name: Test interface
        run: node tests/ui.test.cjs
      - name: Test onboarding and Folio assistant
        run: node tests/v2.test.cjs
      - name: Configure signing
        id: signing
        env:
          KEY_B64: ${{ secrets.FOLIO_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/folio-release.p12"
            chmod 600 "$RUNNER_TEMP/folio-release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets absent. TEST APK only; future updates must use the stable release key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build updateable signed release
        id: signed_build
        continue-on-error: true
        if: steps.signing.outputs.signed == 'true'
        env:
          FOLIO_SIGNING_STORE_FILE: ${{ runner.temp }}/folio-release.p12
          FOLIO_SIGNING_PASSWORD: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
          FOLIO_VERSION_CODE: ${{ github.run_number }}
          FOLIO_VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Build installable test APK
        if: steps.signed_build.outcome != 'success'
        env:
          FOLIO_VERSION_CODE: ${{ github.run_number }}
          FOLIO_VERSION_NAME: 0.1.${{ github.run_number }}-test
        run: gradle -p android assembleDebug --no-daemon
      - name: Verify installable APK integrity and signing
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signed_build.outcome }}" = "success" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          SDKTOOLS="$ANDROID_HOME/build-tools/35.0.0"
          echo "::group::APK signature and Android platform compatibility"
          "$SDKTOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDKTOOLS/aapt" dump badging "$APK" | tee /tmp/folio-apk-badging.txt
          echo "::endgroup::"
          echo "::group::ZIP alignment and checksum"
          "$SDKTOOLS/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 2
          echo "::endgroup::"
          grep -q "package: name='com.folio.finance'" /tmp/folio-apk-badging.txt
          grep -q 'sdkVersion:' /tmp/folio-apk-badging.txt
      - name: Upload signed APK
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test APK
        if: steps.signed_build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Folio-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test APK as GitHub prerelease
        if: steps.signed_build.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: folio-test-${{ github.run_number }}
          name: Folio test build #${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish signed release
        if: steps.signed_build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Folio v0.1.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
