name: Build Folio APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test transaction parser and duplicate detection
        run: |
          mkdir -p /tmp/folio-parser-tests
          javac --release 17 -d /tmp/folio-parser-tests \
            android/app/src/main/java/com/folio/finance/TransactionParser.java \
            android/app/src/main/java/com/folio/finance/IngestionDedup.java \
            tests/ParserTest.java tests/DedupTest.java
          java -cp /tmp/folio-parser-tests ParserTest
          java -cp /tmp/folio-parser-tests DedupTest
      - name: Parse bundled assets as ES2018
        run: node tests/chrome69-syntax.cjs
      - name: Test money flow, quick add, and voice drafts
        run: node tests/flow.test.cjs
      - name: Test interface
        run: node tests/ui.test.cjs
      - name: Test onboarding and Folio assistant
        run: node tests/v2.test.cjs
      - name: Test money, migration, backup and legacy CSV
        run: node tests/money.test.cjs
      - name: Test Ask Folio assistant engine
        run: node tests/assistant.test.cjs
      - name: Test payday runway
        run: node tests/payday-runway.test.cjs
      - name: Test upgrade boot does not hide a stored ledger
        run: node tests/upgrade-boot.test.cjs
      - name: Compile release without signing secrets
        if: github.event_name == 'pull_request'
        run: chmod +x android/gradlew && android/gradlew -p android assembleRelease --no-daemon
      - name: Verify permanent signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEY_B64: ${{ secrets.FOLIO_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Permanent signing secrets missing. Configure FOLIO_KEYSTORE_B64 and FOLIO_SIGNING_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/folio-release.p12"
          chmod 600 "$RUNNER_TEMP/folio-release.p12"
          if ! keytool -list -keystore "$RUNNER_TEMP/folio-release.p12" -storetype PKCS12 -storepass "$KEY_PASS" -alias folio >/dev/null 2>&1; then
            echo "::error::Invalid signing password, keystore or alias. Re-enter both Actions secrets from your original PRIVATE signing kit. Do not commit the kit."
            exit 1
          fi
          EXPECTED_CERT="126a716dad1de9968cfb293aa4c7b3b7567d22d1ccc36cdf62f3fdbc3ce7767f"
          FOUND_CERT=$(keytool -exportcert -alias folio -keystore "$RUNNER_TEMP/folio-release.p12" -storetype PKCS12 -storepass "$KEY_PASS" | sha256sum | awk '{print $1}')
          if [ "$FOUND_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Signing identity differs from the approved Folio release certificate. Refusing to rotate update identity."
            exit 1
          fi
          echo "Folio permanent certificate verified: $FOUND_CERT"
      - name: Build permanently signed release
        if: github.event_name != 'pull_request'
        env:
          FOLIO_SIGNING_STORE_FILE: ${{ runner.temp }}/folio-release.p12
          FOLIO_SIGNING_PASSWORD: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
          FOLIO_VERSION_CODE: ${{ github.run_number }}
          FOLIO_VERSION_NAME: 0.3.${{ github.run_number }}
        run: chmod +x android/gradlew && android/gradlew -p android assembleRelease --no-daemon
      - name: Re-sign release with v1, v2, and v3
        if: github.event_name != 'pull_request'
        env:
          FOLIO_SIGNING_STORE_FILE: ${{ runner.temp }}/folio-release.p12
          FOLIO_SIGNING_PASSWORD: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          # AGP drops the JAR signature when minSdk is 24 or higher, even with enableV1Signing.
          # --min-sdk-version 23 only tells apksigner to write v1. The manifest minSdk stays 26.
          "$TOOLS/apksigner" sign \
            --ks "$FOLIO_SIGNING_STORE_FILE" \
            --ks-type PKCS12 \
            --ks-key-alias folio \
            --ks-pass "pass:${FOLIO_SIGNING_PASSWORD}" \
            --key-pass "pass:${FOLIO_SIGNING_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --min-sdk-version 23 \
            "$APK"
      - name: Verify signed APK integrity and compatibility
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/folio-apk-badging.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          SCHEME23=$("$TOOLS/apksigner" verify --verbose --min-sdk-version 23 "$APK")
          SCHEME26=$("$TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK")
          printf '%s\n' "$SCHEME23"
          printf '%s\n' "$SCHEME26"
          printf '%s\n' "$SCHEME23" | grep -q "Verified using v1 scheme (JAR signing): true"
          printf '%s\n' "$SCHEME23" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          printf '%s\n' "$SCHEME23" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          printf '%s\n' "$SCHEME26" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          printf '%s\n' "$SCHEME26" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          unzip -v "$APK" | awk '/resources\.arsc$/ { if ($0 !~ /Stored/) { print "resources.arsc must be stored uncompressed"; exit 1 } }'
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 2
          grep -q "package: name='com.folio.finance.app'" /tmp/folio-apk-badging.txt
          grep -q 'sdkVersion:' /tmp/folio-apk-badging.txt
          APK_CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [ "$APK_CERT" != "126a716dad1de9968cfb293aa4c7b3b7567d22d1ccc36cdf62f3fdbc3ce7767f" ]; then
            echo "::error::Built APK certificate is not the pinned Folio release identity"
            exit 1
          fi
      - name: Upload permanent signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Updateable-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: Folio v0.3.${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Prerelease. This signed build stays off releases/latest until the device upgrade passes.
            The upgrade enters data on v0.2.33 and on the schema-1 release v0.3.46, then reads it back.
          files: android/app/build/outputs/apk/release/app-release.apk
