name: Build Folio APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test transaction parser
        run: |
          mkdir -p /tmp/folio-parser-tests
          javac -d /tmp/folio-parser-tests android/app/src/main/java/com/folio/finance/TransactionParser.java tests/ParserTest.java
          java -cp /tmp/folio-parser-tests ParserTest
      - name: Test interface
        run: node tests/ui.test.cjs
      - name: Test onboarding and Folio assistant
        run: node tests/v2.test.cjs
      - name: Verify permanent signing identity
        shell: bash
        env:
          KEY_B64: ${{ secrets.FOLIO_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Permanent signing secrets missing. Configure FOLIO_KEYSTORE_B64 and FOLIO_SIGNING_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/folio-release.p12"
          chmod 600 "$RUNNER_TEMP/folio-release.p12"
          if ! keytool -list -keystore "$RUNNER_TEMP/folio-release.p12" -storetype PKCS12 -storepass "$KEY_PASS" -alias folio >/dev/null 2>&1; then
            echo "::error::Invalid signing password, keystore or alias. Re-enter both Actions secrets from your original PRIVATE signing kit. Do not commit the kit."
            exit 1
          fi
          EXPECTED_CERT="126a716dad1de9968cfb293aa4c7b3b7567d22d1ccc36cdf62f3fdbc3ce7767f"
          FOUND_CERT=$(keytool -exportcert -alias folio -keystore "$RUNNER_TEMP/folio-release.p12" -storetype PKCS12 -storepass "$KEY_PASS" | sha256sum | awk '{print $1}')
          if [ "$FOUND_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Signing identity differs from the approved Folio release certificate. Refusing to rotate update identity."
            exit 1
          fi
          echo "Folio permanent certificate verified: $FOUND_CERT"
      - name: Build permanently signed release
        env:
          FOLIO_SIGNING_STORE_FILE: ${{ runner.temp }}/folio-release.p12
          FOLIO_SIGNING_PASSWORD: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
          FOLIO_VERSION_CODE: ${{ github.run_number }}
          FOLIO_VERSION_NAME: 0.2.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify signed APK integrity and compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/folio-apk-badging.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 2
          grep -q "package: name='com.folio.finance'" /tmp/folio-apk-badging.txt
          grep -q 'sdkVersion:' /tmp/folio-apk-badging.txt
          APK_CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [ "$APK_CERT" != "126a716dad1de9968cfb293aa4c7b3b7567d22d1ccc36cdf62f3fdbc3ce7767f" ]; then
            echo "::error::Built APK certificate is not the pinned Folio release identity"
            exit 1
          fi
      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Updateable-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish permanent release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Folio v0.2.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
