name: Folio Side-by-Side Android Installation Test

on:
  workflow_run:
    workflows: ["Build Folio APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-coexistence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download previous Folio and permanent signed Folio
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/folio-old.apk \
            https://github.com/mohannadzohair456-beep/folio-finance/releases/download/folio-test-26/app-debug.apk
          curl -fL --retry 3 --output /tmp/folio-new.apk \
            https://github.com/mohannadzohair456-beep/folio-finance/releases/latest/download/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$TOOLS/aapt"
          "$TOOLS/aapt" dump badging /tmp/folio-old.apk | tee /tmp/old-package
          "$TOOLS/aapt" dump badging /tmp/folio-new.apk | tee /tmp/new-package
          grep -q "package: name='com.folio.finance'" /tmp/old-package
          grep -q "package: name='com.folio.finance.app'" /tmp/new-package
          "$TOOLS/apksigner" verify /tmp/folio-old.apk
          "$TOOLS/apksigner" verify /tmp/folio-new.apk
      - name: Prepare KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install both APKs on one Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install /tmp/folio-old.apk
            adb install /tmp/folio-new.apk
            adb shell pm path com.folio.finance
            adb shell pm path com.folio.finance.app
            adb shell am start -n com.folio.finance.app/com.folio.finance.MainActivity
            sleep 8
            adb shell pidof com.folio.finance.app
            echo "SUCCESS: Both old Folio and permanently signed Folio are installed at once."
