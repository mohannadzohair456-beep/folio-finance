/* <folio-inline:folio-data.js> */
/* Folio data layer. No DOM and no network.
   Schema 0 (missing schemaVersion): category budgets are major-unit numbers.
   Schema 1: category budgets are integer minor units (piasters/cents/halalas).
   Planning fields monthlyBudgetMinor, monthlyIncomeMinor and reportedBalanceMinor
   were already minor units before schema 1 and are never multiplied again. */
(function (root) {
  'use strict';
  const SCHEMA_VERSION = 1;
  const STORAGE_KEY = 'folio_finance_v1';
  const SNAPSHOT_KEY = 'folio_finance_premigration_snapshot';
  const RESTORE_SNAPSHOT_KEY = 'folio_finance_pre_restore_snapshot';
  const CURRENCIES = ['EGP', 'USD', 'SAR', 'AED', 'EUR', 'GBP'];
  const DEFAULT_SOURCES = ['com.google.android.apps.messaging', 'com.samsung.android.messaging', 'com.android.mms'];
  const ENVELOPE_KEYS = { folioBackup: 1, exportedAt: 1 };

  function clone(value) {
    if (value === undefined) return undefined;
    return JSON.parse(JSON.stringify(value));
  }

  function emptyState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      demo: false,
      currency: 'EGP',
      capture: false,
      sources: DEFAULT_SOURCES.slice(),
      budgets: {},
      transactions: [],
      monthlyBudgetMinor: 0,
      monthlyIncomeMinor: 0,
      reportedBalanceMinor: null,
      balanceReportedAt: null,
      v2Onboarded: false,
      legacyUnparsedBudgets: [],
      legacyQueue: []
    };
  }

  /** Exact major-to-minor conversion for integer and 1–2 decimal strings. */
  function majorToMinor(value) {
    if (typeof value === 'number') {
      if (!Number.isFinite(value)) return null;
      if (Object.is(value, -0)) return 0;
      if (Number.isInteger(value)) return value * 100;
      return Math.round(value * 100);
    }
    if (value == null) return null;
    const text = String(value).trim().replace(/,/g, '').replace(/\s/g, '');
    if (!text) return null;
    const match = /^(-?)(\d+)(?:\.(\d{1,4}))?$/.exec(text);
    if (!match) return null;
    const frac = match[3] || '';
    if (frac.length > 2 && !/^0+$/.test(frac.slice(2))) return null;
    const sign = match[1] === '-' ? -1 : 1;
    const cents = Number(frac.slice(0, 2).padEnd(2, '0') || '0');
    const minor = sign * (Number(match[2]) * 100 + cents);
    return Number.isSafeInteger(minor) ? minor : null;
  }

  function coerceTransaction(entry, index) {
    if (entry == null || typeof entry !== 'object' || Array.isArray(entry)) {
      return {
        id: 'legacy-' + index,
        merchant: entry == null ? 'Incomplete record' : String(entry).slice(0, 150),
        category: 'Other',
        currency: 'EGP',
        amountMinor: 0,
        occurredAt: 0,
        source: 'legacy',
        incomplete: true,
        legacyRaw: entry === undefined ? null : entry
      };
    }
    const copy = Object.assign({}, entry);
    if (copy.id == null || copy.id === '') copy.id = 'legacy-' + index + '-' + (copy.occurredAt || 0);
    if (!copy.merchant) copy.merchant = 'Transaction';
    if (!copy.category) copy.category = 'Other';
    if (!copy.source) copy.source = 'manual';
    if (copy.amountMinor == null && copy.amount != null) {
      const minor = majorToMinor(copy.amount);
      if (minor != null) copy.amountMinor = minor;
    }
    if (typeof copy.amountMinor === 'string' && /^-?\d+$/.test(copy.amountMinor.trim())) {
      copy.amountMinor = Number(copy.amountMinor.trim());
    }
    return copy;
  }

  function walkBudgets(budgets, legacy, convert) {
    const out = {};
    if (budgets == null) return out;
    if (typeof budgets !== 'object' || Array.isArray(budgets)) {
      legacy.push({ value: budgets });
      return out;
    }
    Object.keys(budgets).forEach(currency => {
      const cats = budgets[currency];
      if (cats == null || typeof cats !== 'object' || Array.isArray(cats)) {
        legacy.push({ currency: currency, value: cats });
        return;
      }
      out[currency] = {};
      Object.keys(cats).forEach(cat => {
        const minor = convert(cats[cat]);
        if (minor == null || minor < 0 || !Number.isSafeInteger(minor)) legacy.push({ currency: currency, category: cat, value: cats[cat] });
        else out[currency][cat] = minor;
      });
    });
    return out;
  }

  function finiteMinor(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || !Number.isSafeInteger(Math.round(n))) return null;
    return Math.round(n);
  }

  function migrate(input, corruptText) {
    if (typeof corruptText === 'string') {
      return {
        state: emptyState(),
        snapshot: {
          folioSnapshot: 'premigration',
          capturedAt: new Date().toISOString(),
          fromSchema: null,
          reason: 'unparsed',
          raw: corruptText
        },
        migrated: true
      };
    }
    if (input == null) return { state: emptyState(), snapshot: null, migrated: false };
    if (typeof input !== 'object' || Array.isArray(input)) {
      const state = emptyState();
      state.legacyUnparsedTop = input === undefined ? null : clone(input);
      return {
        state: state,
        snapshot: {
          folioSnapshot: 'premigration',
          capturedAt: new Date().toISOString(),
          fromSchema: null,
          reason: 'not-an-object',
          state: clone(input)
        },
        migrated: true
      };
    }

    const fromSchema = Number.isFinite(Number(input.schemaVersion)) ? Number(input.schemaVersion) : 0;
    const legacyDemo = input.demo === true;
    const needsMigration = fromSchema < SCHEMA_VERSION || legacyDemo;
    const snapshot = needsMigration ? {
      folioSnapshot: 'premigration',
      capturedAt: new Date().toISOString(),
      fromSchema: fromSchema,
      toSchema: SCHEMA_VERSION,
      state: clone(input)
    } : null;

    const state = emptyState();
    Object.keys(input).forEach(key => {
      if (Object.prototype.hasOwnProperty.call(emptyState(), key) || ENVELOPE_KEYS[key]) return;
      state[key] = clone(input[key]);
    });

    state.schemaVersion = SCHEMA_VERSION;
    state.demo = false;
    state.currency = CURRENCIES.indexOf(input.currency) >= 0 ? input.currency : 'EGP';
    if (input.currency != null && state.currency !== input.currency) state.legacyCurrency = input.currency;
    state.capture = input.capture === true;
    state.v2Onboarded = input.v2Onboarded === true;
    state.sources = Array.isArray(input.sources)
      ? input.sources.filter(item => typeof item === 'string')
      : DEFAULT_SOURCES.slice();
    if (Array.isArray(input.sources)) {
      const dropped = input.sources.filter(item => typeof item !== 'string');
      if (dropped.length) state.legacySources = clone(dropped);
    }

    const balance = input.reportedBalanceMinor;
    if (balance == null || balance === '') state.reportedBalanceMinor = null;
    else {
      const minor = finiteMinor(balance);
      state.reportedBalanceMinor = minor;
      if (minor == null) state.legacyReportedBalance = clone(balance);
    }
    const reportedAt = finiteMinor(input.balanceReportedAt);
    state.balanceReportedAt = input.balanceReportedAt == null || input.balanceReportedAt === '' ? null : reportedAt;
    if (input.balanceReportedAt != null && input.balanceReportedAt !== '' && reportedAt == null) {
      state.legacyBalanceReportedAt = clone(input.balanceReportedAt);
    }

    const monthlyBudget = finiteMinor(input.monthlyBudgetMinor);
    state.monthlyBudgetMinor = monthlyBudget == null || monthlyBudget < 0 ? 0 : monthlyBudget;
    if (input.monthlyBudgetMinor != null && state.monthlyBudgetMinor !== monthlyBudget) state.legacyMonthlyBudget = clone(input.monthlyBudgetMinor);
    const monthlyIncome = finiteMinor(input.monthlyIncomeMinor);
    state.monthlyIncomeMinor = monthlyIncome == null || monthlyIncome < 0 ? 0 : monthlyIncome;
    if (input.monthlyIncomeMinor != null && state.monthlyIncomeMinor !== monthlyIncome) state.legacyMonthlyIncome = clone(input.monthlyIncomeMinor);

    const legacyBudgets = Array.isArray(input.legacyUnparsedBudgets) ? clone(input.legacyUnparsedBudgets) : [];
    if (legacyDemo) {
      state.budgets = {};
      if (input.budgets != null) state.legacyDemoBudgets = clone(input.budgets);
    } else if (fromSchema < SCHEMA_VERSION) {
      state.budgets = walkBudgets(input.budgets, legacyBudgets, majorToMinor);
    } else {
      state.budgets = walkBudgets(input.budgets, legacyBudgets, value => {
        const minor = finiteMinor(value);
        return minor == null ? null : minor;
      });
    }
    state.legacyUnparsedBudgets = legacyBudgets;

    const rows = Array.isArray(input.transactions) ? input.transactions : [];
    if (!Array.isArray(input.transactions) && input.transactions != null) state.legacyTransactions = clone(input.transactions);
    state.transactions = rows.map((entry, index) => {
      if (legacyDemo && entry && typeof entry === 'object' && !Array.isArray(entry) && entry.source === 'demo') return null;
      return coerceTransaction(entry, index);
    }).filter(Boolean);
    state.legacyQueue = Array.isArray(input.legacyQueue) ? clone(input.legacyQueue) : [];
    return { state: state, snapshot: snapshot, migrated: needsMigration };
  }

  function summarize(records, primaryCurrency) {
    const primary = primaryCurrency || 'EGP';
    const byCurrency = {};
    (records || []).forEach(entry => {
      if (!entry || typeof entry !== 'object') return;
      const amount = Number(entry.amountMinor);
      if (!Number.isFinite(amount)) return;
      if (entry.direction !== 'income' && entry.direction !== 'expense') return;
      const currency = entry.currency || '';
      if (!byCurrency[currency]) byCurrency[currency] = { income: 0, expense: 0, net: 0, currency: currency };
      byCurrency[currency][entry.direction] += amount;
      byCurrency[currency].net = byCurrency[currency].income - byCurrency[currency].expense;
    });
    const own = byCurrency[primary] || { income: 0, expense: 0, net: 0, currency: primary };
    return {
      income: own.income,
      expense: own.expense,
      net: own.net,
      currency: primary,
      byCurrency: byCurrency
    };
  }

  function budgetTotalMinor(limits) {
    if (!limits || typeof limits !== 'object') return 0;
    return Object.keys(limits).reduce((sum, key) => {
      const n = Number(limits[key]);
      return sum + (Number.isFinite(n) ? n : 0);
    }, 0);
  }

  function buildBackup(state) {
    const copy = clone(state || emptyState());
    copy.folioBackup = 1;
    copy.schemaVersion = SCHEMA_VERSION;
    copy.exportedAt = new Date().toISOString();
    return copy;
  }

  function restoreBackup(text) {
    if (typeof text !== 'string' || text.length > 2000000) throw Error('Backup is too large (2 MB maximum).');
    const trimmed = text.replace(/^\uFEFF/, '').trim();
    if (!trimmed) throw Error('Backup file is empty.');
    if (trimmed.charAt(0) !== '{' && trimmed.charAt(0) !== '[') {
      throw Error('This is not a Folio JSON backup. Use Import CSV for a transaction spreadsheet so balances and budgets are kept.');
    }
    let parsed;
    try { parsed = JSON.parse(trimmed); }
    catch (e) { throw Error('Backup file is not valid JSON.'); }
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw Error('Backup file must be a Folio JSON object.');
    const looksLikeFolio = parsed.folioBackup === 1 || Array.isArray(parsed.transactions) || (parsed.budgets && typeof parsed.budgets === 'object');
    if (!looksLikeFolio) throw Error('Backup file is missing Folio data.');
    return migrate(parsed, null).state;
  }

  function csvRows(text, delimiter) {
    if (typeof text !== 'string' || text.length > 2000000) throw Error('CSV is too large (2 MB maximum).');
    const rows = [];
    let row = [];
    let field = '';
    let inside = false;
    const csv = text.replace(/^\uFEFF/, '');
    for (let i = 0; i < csv.length; i++) {
      const ch = csv.charAt(i);
      if (ch === '"') {
        if (inside && csv.charAt(i + 1) === '"') { field += '"'; i++; }
        else if (inside) inside = false;
        else if (field === '') inside = true;
        else throw Error('Invalid quote in CSV');
      } else if (ch === delimiter && !inside) {
        row.push(field);
        field = '';
      } else if ((ch === '\r' || ch === '\n') && !inside) {
        row.push(field);
        if (row.some(value => String(value).trim())) rows.push(row);
        row = [];
        field = '';
        if (ch === '\r' && csv.charAt(i + 1) === '\n') i++;
      } else field += ch;
    }
    if (inside) throw Error('Unclosed quoted field in CSV');
    row.push(field);
    if (row.some(value => String(value).trim())) rows.push(row);
    return rows;
  }

  function headerIndex(rows) {

function cashChart(){const records=monthTx(),today=new Date(),maxDay=Math.max(10,today.getDate()),w=560,height=205,pad=31;const daily=Array.from({length:maxDay},(_,i)=>{let a=records.filter(t=>new Date(t.occurredAt).getDate()===i+1);return txStats(a);});
 let e=0,inc=0;const out=daily.map(x=>(e+=x.expense)),ins=daily.map(x=>(inc+=x.income)),max=Math.max(1,...out,...ins)*1.15;
 const points=a=>a.map((v,i)=>[pad+(w-pad*1.5)*i/Math.max(1,maxDay-1),height-20-(height-43)*v/max]);const pOut=points(out),pInc=points(ins);const path=pts=>'M'+pts.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' L');
 const fill=`${path(pOut)} L${pOut[pOut.length-1][0]},${height-20} L${pad},${height-20} Z`;
 const lines=[0,.25,.5,.75,1].map(n=>{let y=height-20-(height-43)*n;return `<line x1="${pad}" x2="${w-10}" y1="${y}" y2="${y}" stroke="#eaf0e9" stroke-dasharray="3 5"/><text x="0" y="${y+3}" fill="#abb6ad" font-size="9">${max*n>=1000?(max*n/100000).toFixed(0)+'k':(max*n/100).toFixed(0)}</text>`;}).join('');
 let labels=[1,Math.round(maxDay/3),Math.round(2*maxDay/3),maxDay].map(n=>`<text x="${pad+(w-pad*1.5)*(n-1)/Math.max(1,maxDay-1)}" y="${height+0}" fill="#9caba2" text-anchor="middle" font-size="10">${n} ${new Intl.DateTimeFormat('en-US',{month:'short'}).format(today)}</text>`).join('');
 return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${height+9}" role="img" aria-label="Cumulative monthly income and expenses chart"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2b9c79" stop-opacity=".17"/><stop offset="1" stop-color="#2b9c79" stop-opacity=".00"/></linearGradient></defs>${lines}<path d="${fill}" fill="url(#area)"/><path d="${path(pInc)}" stroke="#a8ca7b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${path(pOut)}" stroke="#138a6a" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${labels}</svg></div><div class="chart-legend"><span><i class="legend-dot" style="background:#138a6a"></i> Expenses</span><span><i class="legend-dot" style="background:#a8ca7b"></i> Income</span></div>`;}
function donut(){let totals=catTotals(monthTx());let total=totals.reduce((a,b)=>a+b[1],0);if(!total)return `<div class="empty"><div class="bubble">${icon('chart',23)}</div><strong>No spending yet</strong>Add transactions to see your spending mix.</div>`;
 let degree=0;let sections=totals.map(([name,val])=>{let start=degree;degree+=val/total*360;return `${COLORS[name]||'#becdc3'} ${start}deg ${degree}deg`;});let gradient=`conic-gradient(${sections.join(',')})`;
 return `<div class="donut-layout"><div class="donut" style="background:${gradient}"><div class="donut-inner"><strong>${totals.length}</strong><span>categories</span></div></div><div class="donut-legend">${totals.slice(0,5).map(([cat,v])=>`<div class="category-row"><div class="left"><i class="dot" style="background:${COLORS[cat]||'#becdc3'}"></i><span class="name">${h(cat)}</span></div><strong>${Math.round(v/total*100)}%</strong></div>`).join('')}</div></div>`;}
function singleTx(t){const ico=catIcon(t.category||'Other'),iclass=String(t.category||'Other').toLowerCase().replace(/[^a-z]/g,'').replace('fooddrinks','food').replace('billsutilities','bills');const date=new Date(t.occurredAt);const sameDay=date.toDateString()===new Date().toDateString();return `<div class="transaction-row" tabindex="0" role="button" aria-label="Edit ${h(t.merchant)}" onclick="editById('${h(t.id)}')" onkeydown="if(event.key==='Enter')editById('${h(t.id)}')"><div class="tr-left"><div class="tr-icon ${iclass}">${icon(ico)}</div><div style="min-width:0"><div class="tr-title">${h(t.merchant)}</div><div class="tr-sub">${h(t.category)} · ${t.source==='notification'?'Auto-detected · Review':t.source==='demo'?'Sample':'Manual'}</div></div></div><div class="tr-right"><div class="tr-amount ${t.direction==='income'?'positive':''}">${t.direction==='income'?'+':'−'}${fmt(t.amountMinor,t.currency)}</div><div class="tr-meta">${sameDay?'Today':date.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div></div>`;}
function lastTx(n=5){return [...state.transactions].filter(t=>t.currency===state.currency).sort((a,b)=>b.occurredAt-a.occurredAt).slice(0,n);}
function recentPanel(){const tx=lastTx(5);return `<section class="panel"><div class="panel-heading"><div><h2>Recent activity</h2><p>Your latest money movements</p></div><button class="mini-link" onclick="nav('transactions')">View all ${icon('arrow',13)}</button></div>${tx.length?`<div class="transaction-list">${tx.map(singleTx).join('')}</div>`:empty('Your activity starts here','Add a transaction or connect notification tracking.')}</section>`;}
function empty(title,msg){return `<div class="empty"><div class="bubble">${icon('wallet',23)}</div><strong>${h(title)}</strong>${h(msg)}</div>`;}
function overview(){let stats=txStats(monthTx()),limits=currentBudgets(),budgetMinor=Object.keys(limits).reduce((s,k)=>s+(Number.isFinite(Number(limits[k]))?Number(limits[k]):0),0),spentMinor=monthTx().filter(t=>t&&t.direction==='expense'&&Number.isFinite(Number(limits[t.category]))).reduce((s,t)=>s+Number(t.amountMinor||0),0),bpct=budgetMinor?Math.min(100,spentMinor/budgetMinor*100):0,budgetTotal=budgetMinor>0;
 return `${heading('YOUR FINANCIAL SPACE','Your money, in focus.','Here’s what your finances look like this month.')}${demoNotice()}${foreignCurrencyNote(monthAll())}<div class="v2-overview-entry"><button class="v2-ai-entry" onclick="nav('assistant')">${icon('sparkle',16)} Ask Folio · Financial companion →</button>${window.FolioV2&&window.FolioV2.estimatedBalance()!==null?`<span class="v2-mini-balance">Available estimate · ${fmt(window.FolioV2.estimatedBalance(),state.currency)}</span>`:''}</div>${state.monthlyBudgetMinor>0?`<div class="v2-planning-banner"><span>Monthly spending target</span><strong>${fmt(state.monthlyBudgetMinor,state.currency)}</strong><small>${fmt(state.monthlyBudgetMinor-txStats(monthTx()).expense,state.currency)} left after recorded spending · manually planned</small></div>`:''}<div class="metrics">${metric('Net cash flow',stats.net,'net',stats.net>=0?'More coming in than going out':'Spending exceeds income',true)}${metric('Money in',stats.income,'in',`${monthTx().filter(t=>t.direction==='income').length} incoming transactions`)}${metric('Money out',stats.expense,'out',`${monthTx().filter(t=>t.direction==='expense').length} outgoing transactions`)}</div><div class="dashboard-grid"><section class="panel"><div class="panel-heading"><div><h2>Cash flow overview</h2><p>How your money is moving through ${monthTitle()}</p></div><span class="chip">This month</span></div>${cashChart()}</section><section class="panel"><div class="panel-heading"><div><h2>Where money went</h2><p>Expenses by category</p></div><button class="mini-link" onclick="nav('insights')">Explore ${icon('arrow',13)}</button></div>${donut()}</section></div><div class="lower-grid">${recentPanel()}<section class="panel"><div class="panel-heading"><div><h2>Budget snapshot</h2><p>Stay comfortably on track</p></div><button class="mini-link" onclick="nav('budgets')">Manage ${icon('arrow',13)}</button></div><div class="budget-card"><div class="budget-top"><span class="budget-icon">${icon('wallet',19)}</span><span class="chip" style="background:#e1f0db;border-color:#d9eacb">${budgetTotal?Math.round(bpct)+'% used':'Not set'}</span></div><strong>${budgetTotal?fmt(Math.max(0,budgetMinor-spentMinor),state.currency)+' left to spend':'Make a plan that works'}</strong><p>${budgetTotal?'Across your categories with monthly budgets.':'Set monthly spending limits and watch your progress automatically.'}</p><div class="progress"><span style="width:${bpct}%;background:${bpct>95?'#df806d':'#278a6c'}"></span></div><div class="budget-summary"><span>${fmt(spentMinor,state.currency)} spent</span><span>${fmt(budgetMinor,state.currency)} budget</span></div></div><button class="secondary" style="margin-top:16px;width:100%" onclick="nav('budgets')">View my budgets ${icon('arrow',14)}</button></section></div>`;}
function transactions(){let list=[...state.transactions].sort((a,b)=>b.occurredAt-a.occurredAt).filter(t=>t.currency===state.currency && (filter==='all'||t.direction===filter) && (`${t.merchant} ${t.category} ${t.source}`.toLowerCase().includes(query.toLowerCase())));let groups={};list.forEach(t=>{let d=new Date(t.occurredAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});(groups[d]||(groups[d]=[])).push(t);});
 return `${heading('EVERY MOVEMENT MATTERS','Transactions','Every expense and every deposit, all in one place.')}${demoNotice()}<section class="panel"><div class="panel-heading"><div><h2>All transactions</h2><p>${list.length} ${list.length===1?'transaction':'transactions'} in ${state.currency}</p></div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="mini-link" onclick="chooseImportCsv()">${icon('plus',14)} Import CSV</button><button class="mini-link" onclick="exportCsv()">${icon('download',14)} Export CSV</button><button class="mini-link" onclick="chooseImportJson()">${icon('plus',14)} Import JSON</button><button class="mini-link" onclick="exportJson()">${icon('download',14)} Export JSON</button></div></div><div class="toolbar"><div class="searchbox">${icon('search')}<input aria-label="Search transactions" placeholder="Search merchants or categories..." value="${h(query)}" oninput="setQuery(this.value)"></div><div class="filter-tabs" aria-label="Transaction filters">${[['all','All'],['expense','Expenses'],['income','Income']].map(([id,label])=>`<button class="${filter===id?'active':''}" onclick="setFilter('${id}')">${label}</button>`).join('')}</div></div>${list.length?Object.entries(groups).map(([date,items])=>`<div class="table-group">${h(date)}</div>${items.map(singleTx).join('')}`).join(''):empty('No matching transactions','Try another search or add your first transaction.')}</section>${otherCurrencySection()}`;}
function setQuery(q){query=q;let pos=0;render();let inp=document.querySelector('.searchbox input');if(inp){inp.focus();inp.setSelectionRange(q.length,q.length);}}

function insights(){let curr=monthTx(),s=txStats(curr),parts=catTotals(curr),total=s.expense,max=parts.length?parts[0][1]:1,months=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-(5-i));let list=state.transactions.filter(t=>{let x=new Date(t.occurredAt);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()&&t.currency===state.currency;});return {label:d.toLocaleDateString('en-US',{month:'short'}),...txStats(list)};});let maxMonthly=Math.max(1,...months.map(x=>Math.max(x.income,x.expense)));
 return `${heading('UNDERSTAND THE BIG PICTURE','Financial insights','Look beyond transactions. Find the patterns that matter.')}${demoNotice()}<div class="metrics">${metric('Total income',s.income,'in','Current calendar month',true)}${metric('Total expenses',s.expense,'out','Current calendar month')}${`<div class="metric"><div class="metric-top"><span>Savings rate</span><span class="metric-icon">${icon('chart',17)}</span></div><div class="metric-amount">${s.income?Math.round(s.net/s.income*100)+'%':'—'}</div><div class="metric-sub">${s.income?'Net cash flow as a share of income':'Add income to calculate'}</div></div>`}</div><div class="insights-grid"><section class="panel"><div class="panel-heading"><div><h2>Six-month comparison</h2><p>See your income and expenses side by side</p></div></div><div style="display:flex;gap:11px;align-items:flex-end;height:203px;padding-top:14px;border-bottom:1px solid #ecf1ec">${months.map(m=>`<div style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px"><div style="flex:1;width:100%;display:flex;gap:4px;align-items:flex-end;justify-content:center"><div title="Income ${h(fmt(m.income,state.currency))}" style="height:${Math.max(m.income?3:0,m.income/maxMonthly*100)}%;width:31%;background:#c3e6b1;border-radius:6px 6px 0 0"></div><div title="Expenses ${h(fmt(m.expense,state.currency))}" style="height:${Math.max(m.expense?3:0,m.expense/maxMonthly*100)}%;width:31%;background:#148568;border-radius:6px 6px 0 0"></div></div><span style="font-size:10px;color:#9cab9f">${m.label}</span></div>`).join('')}</div><div class="chart-legend" style="padding-top:13px"><span><i class="legend-dot" style="background:#c3e6b1"></i> Income</span><span><i class="legend-dot" style="background:#148568"></i> Expenses</span></div></section><section class="panel"><div class="panel-heading"><div><h2>Expense categories</h2><p>Your biggest areas of spending</p></div></div>${parts.length?parts.map(([cat,v])=>`<div class="category-bar"><div class="category-bar-title"><b>${h(cat)}</b><span>${fmt(v,state.currency)}</span></div><div class="progress"><span style="width:${v/max*100}%;background:${COLORS[cat]||'#91ab95'}"></span></div></div>`).join(''):empty('No categories yet','Your breakdown will appear here.')}</section></div><div class="panel" style="margin-top:20px"><div class="panel-heading"><div><h2>A helpful distinction</h2><p>Cash flow is not the same as your bank balance.</p></div>${icon('info',19)}</div><p style="font-size:12px;line-height:1.7;color:#7e9186;margin:0">Folio calculates income minus expenses for recorded transactions. It cannot know your current bank balance without an opening balance or direct account connection. Multiple currencies are never silently added together.</p></div>`;}
function budgets(){let parts=catTotals(monthTx()), keys=Object.keys(currentBudgets()),spentMap=Object.fromEntries(parts);let totalLimit=keys.reduce((s,k)=>s+(Number.isFinite(Number(currentBudgets()[k]))?Number(currentBudgets()[k]):0),0),totalSpent=keys.reduce((s,k)=>s+(Number(spentMap[k])||0),0);
 return `${heading('YOUR SPENDING GUARDRAILS','Monthly budgets','Give every category room to breathe.')}${demoNotice()}${otherBudgetNote()}${state.monthlyBudgetMinor>0?`<div class="v2-planning-banner"><span>Overall spending target</span><strong>${fmt(state.monthlyBudgetMinor,state.currency)} / month</strong><small>${fmt(state.monthlyBudgetMinor-txStats(monthTx()).expense,state.currency)} remaining after all recorded expenses. To change it, tell Ask Folio your new monthly budget.</small><button class="v2-plan-edit" onclick="nav('assistant')">Edit with Folio →</button></div>`:''}<div class="metrics">${metric('Total budget',totalLimit,'net','Across all planned categories',true)}${metric('Budgeted spending',totalSpent,'out','Spent in budgeted categories')}${metric('Budget remaining',Math.max(0,totalLimit-totalSpent),'in','Left for the current month')}</div><div class="panel"><div class="panel-heading"><div><h2>Category budgets</h2><p>Adjust your spending limits whenever you like</p></div><button class="secondary" onclick="showBudget()">${icon('plus',15)} Set a budget</button></div>${keys.length?`<div class="budget-lines">${keys.map(cat=>{let limit=Number(currentBudgets()[cat]),spent=Number(spentMap[cat])||0,pct=limit?Math.min(100,spent/limit*100):0;return `<div class="budget-line"><div class="tr-icon">${icon(catIcon(cat))}</div><div class="budget-line-content"><div class="budget-line-head"><strong>${h(cat)}</strong><small>${fmt(spent,state.currency)} / ${fmt(limit,state.currency)}</small></div><div class="progress"><span style="width:${pct}%;background:${spent>limit?'#e68074':COLORS[cat]||'#328c79'}"></span></div></div><button class="iconbtn" style="width:33px;height:33px;flex-shrink:0" title="Edit budget" onclick="showBudget('${h(cat)}')">${icon('edit',15)}</button></div>`;}).join('')}</div>`:empty('No budgets yet','Set your first category budget to manage spending.')}</div>`;}
function settings(){let sources=state.sources||[],permitted=native()?permissionStatus:false;return `${heading('YOUR SPACE, YOUR RULES','Settings & privacy','Control how Folio tracks, stores and displays your finances.')}${demoNotice()}${trackingPanel()}<div class="settings-stack"><section class="setting-section"><h2 class="setting-title">Automatic transaction capture</h2><p class="setting-description">Allow Folio to recognize supported financial notifications from the apps you choose. Raw notification messages are not stored.</p><div class="setting-row"><div><strong>Notification monitoring</strong><span>Only transactions from approved sources are processed on your device.</span></div><button aria-label="Toggle automatic capture" class="switch ${state.capture?'on':''}" role="switch" aria-checked="${state.capture}" onclick="toggleCapture()"></button></div><div class="setting-row"><div><strong>Android notification access</strong><span>${native()?'Grant Android system access before importing bank alerts.':'Notification access works in the installed Android app, not the browser preview.'}</span><div class="status-line ${permitted?'success':''}"><i class="dot"></i>${native()?(permitted?'Permission granted':'Permission not granted'):'Browser preview only'}</div></div><button class="secondary" ${!native()?'disabled':''} onclick="grantAccess()">${permitted?'Manage access':'Allow access'}</button></div><div class="setting-row" style="display:block"><strong style="margin-bottom:5px">Approved notification sources</strong><span style="max-width:none">Enter Android app package IDs, separated by commas. Examples for Google Messages and Samsung Messages are already added. You can include your bank’s app package ID.</span><textarea id="sourceInput" class="textinput" rows="2" style="margin-top:12px;resize:vertical">${h(sources.join(', '))}</textarea><div style="display:flex;justify-content:flex-end;margin-top:9px"><button class="secondary" onclick="saveSources()">Save approved apps</button></div><p class="hint">For privacy, no other app’s notifications are parsed. Finances from notifications may need manual correction.</p></div></section><section class="setting-section"><h2 class="setting-title">Preferences</h2><p class="setting-description">Tailor the display to your financial life.</p><div class="setting-row"><div><strong>Reporting currency</strong><span>Only transactions in this currency enter totals; no automatic conversion is performed.</span></div><select aria-label="Reporting currency" onchange="setCurrency(this.value)">${['EGP','USD','SAR','AED','EUR','GBP'].map(c=>`<option ${state.currency===c?'selected':''}>${c}</option>`).join('')}</select></div></section><section class="setting-section"><h2 class="setting-title">Your data stays yours</h2><p class="setting-description">Stored locally on your device. No account, backend, third-party analytics or network permissions required.</p><div class="setting-row"><div><strong>Export transactions (CSV)</strong><span>A spreadsheet of transactions only. Balances, budgets and settings are not included. This is what older Folio builds can import.</span></div><button class="secondary" onclick="exportCsv()">${icon('download',15)} Export CSV</button></div><div class="setting-row"><div><strong>Full JSON backup</strong><span>Transactions, category budgets, reported balance, expected salary, monthly target, currency, allowlist and onboarding state.</span></div><button class="secondary" onclick="exportJson()">${icon('download',15)} Export JSON</button></div><div class="setting-row"><div><strong>Restore a backup</strong><span>Import CSV adds transactions and keeps everything else. Import JSON replaces this device's Folio data after saving a local snapshot.</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="chooseImportCsv()">Import CSV</button><button class="secondary" onclick="chooseImportJson()">Import JSON</button></div></div><div class="setting-row"><div><strong>${state.demo?'Start tracking real money':'Delete all financial records'}</strong><span>${state.demo?'Permanently dismiss sample transactions and start with an empty workspace.':'Clear transaction history and budgets on this device. Cannot be undone.'}</span></div><button class="secondary ${state.demo?'':'danger'}" onclick="${state.demo?'startLive()':'clearAll()'}">${state.demo?'Start now':'Delete data'}</button></div></section><section class="setting-section" style="background:#f0f8f2"><div style="display:flex;gap:14px;align-items:flex-start"><div class="metric-icon">${icon('shield',20)}</div><div><h2 class="setting-title">Designed to respect your privacy</h2><p class="setting-description" style="margin:0">Folio only processes allowlisted sources after you opt in. The recognition is rule-based and completely offline. Imported transactions can be edited or deleted at any time.</p></div></div></section></div>`;}

 const root=document.getElementById('modal-root');root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog-head"><div><h3 id="modal-title">${t?'Edit transaction':'New transaction'}</h3><p>Keep your financial picture up to date.</p></div><button class="close" aria-label="Close" onclick="closeModal()">${icon('close',17)}</button></div><form id="txForm" onsubmit="saveTransaction(event)"><div class="type-option"><button type="button" data-dir="expense" class="${modalType==='expense'?'selected out':''}" onclick="chooseType('expense')">${icon('up',14)} Expense</button><button type="button" data-dir="income" class="${modalType==='income'?'selected':''}" onclick="chooseType('income')">${icon('down',14)} Income</button></div><div class="field"><label for="txmerchant">Merchant or source</label><input id="txmerchant" maxlength="90" placeholder="e.g. Carrefour, Salary, Transfer" required value="${h(t?.merchant||'')}"></div><div class="formgrid"><div class="field"><label for="txamount">Amount</label><input id="txamount" type="number" inputmode="decimal" step="0.01" min="0.01" max="100000000" required placeholder="0.00" value="${t?(t.amountMinor/100).toFixed(2):''}"></div><div class="field"><label for="txcurrency">Currency</label><select id="txcurrency">${['EGP','USD','SAR','AED','EUR','GBP'].map(c=>`<option ${c===(t?.currency||state.currency)?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="formgrid"><div class="field"><label for="txcategory">Category</label><select id="txcategory">${CATEGORIES.map(c=>`<option ${c===(t?.category||(modalType==='income'?'Other income':'Other'))?'selected':''}>${h(c)}</option>`).join('')}</select></div><div class="field"><label for="txdate">Date</label><input id="txdate" type="date" required value="${t?dateInputValue(t.occurredAt):today}"></div></div><div class="dialog-actions">${t?`<button type="button" class="secondary danger" onclick="deleteTransaction('${h(id)}')">${icon('trash',15)} Delete</button>`:''}<div class="right"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit" class="primary">${t?'Save changes':'Add transaction'}</button></div></div></form></div></div>`;document.getElementById('txmerchant').focus();}

/** Restore records from Folio's original CSV export without uploading any data. */
function csvRows(text){
 if(typeof text!=='string'||text.length>2000000)throw Error('CSV is too large (2 MB maximum).');
 const rows=[];let row=[],field='',inside=false;
 const csv=text.replace(/^\uFEFF/,'');
 for(let i=0;i<csv.length;i++){
  const ch=csv[i];
  if(ch==='"'){
   if(inside&&csv[i+1]==='"'){field+='"';i++;}
   else if(inside)inside=false;
   else if(field==='')inside=true;
   else throw Error('Invalid quote in CSV');
  }else if(ch===','&&!inside){row.push(field);field='';}
  else if((ch==='\r'||ch==='\n')&&!inside){
   row.push(field);if(row.some(v=>v.trim()))rows.push(row);
   row=[];field='';if(ch==='\r'&&csv[i+1]==='\n')i++;
  }else field+=ch;
 }
 if(inside)throw Error('Unclosed quoted field in CSV');
 row.push(field);if(row.some(v=>v.trim()))rows.push(row);
 return rows;
}
function importFolioCsv(csv){
 try{
  const records=FolioData.transactionsFromCsv(csv);
  const seen=new Set(state.transactions.map(t=>t&&t.id));
  const novel=records.filter(t=>t&&!seen.has(t.id));
  if(!novel.length){notify('This CSV has already been imported.');return 0;}
  const backup=state.transactions.slice();
  state.transactions=backup.concat(novel);
  if(!persist()){state.transactions=backup;notify('Could not save imported transactions.');return 0;}
  render();notify('Restored '+novel.length+' transaction'+(novel.length===1?'':'s')+' from CSV.');
  return novel.length;
 }catch(e){notify('CSV import failed: '+(e&&e.message?e.message:'invalid file'));return -1;}
}
function importFolioJson(text){

  const next=FolioData.restoreBackup(text);
  if(!confirm('Replace all Folio data on this device with this backup? Current data is kept in a local snapshot.'))return 0;
  try{localStorage.setItem(FolioData.RESTORE_SNAPSHOT_KEY,JSON.stringify({folioSnapshot:'pre-restore',capturedAt:new Date().toISOString(),state:state}));}catch(err){}
  const previous=state;
  state=next;
  if(!persist()){state=previous;notify('Could not save restored backup.');return -1;}
  render();notify('Backup restored.');
  return Array.isArray(state.transactions)?state.transactions.length:0;
 }catch(e){notify('JSON import failed: '+(e&&e.message?e.message:'invalid file'));return -1;}
}

}

window.folioNativeRefresh=refreshNative;

  function onbHtml(){
    const parts=[
      {eyebrow:'YOUR MONEY, SIMPLIFIED',title:'Meet Folio.',desc:'A calmer, smarter way to understand your money and plan the month ahead.',symbol:'◈'},
      {eyebrow:'YOUR FINANCIAL STARTING POINT',title:'Make it yours.',desc:'Enter what you know today. You can change these numbers at any time.',symbol:'◎'},
      {eyebrow:'PRIVACY BY DESIGN',title:'Capture only what you allow.',desc:'Enable optional notification tracking. Folio never needs your banking password.',symbol:'◉'},
      {eyebrow:'READY WHEN YOU ARE',title:'Your financial space is ready.',desc:'Track expenses, set goals, and talk to Folio about everyday decisions.',symbol:'✦'}
    ];
    const d=parts[stage];const isPhone=native();
    return `<div class="v2-onboard"><div class="v2-onboard-inner">
      <header class="v2-onboard-top"><div class="v2-wordmark"><span>◈</span> folio<span>.</span></div><span class="v2-step-label">${stage+1} OF 4</span></header>
      <div class="v2-progress">${[0,1,2,3].map(i=>`<span class="${i<=stage?'current':''}"></span>`).join('')}</div>
      <div class="v2-onboard-hero"><div class="v2-orbit"><div class="v2-orbit-inner">${d.symbol}</div></div><p class="v2-eyebrow">${d.eyebrow}</p><h1>${d.title}</h1><p>${d.desc}</p></div>
      ${stage===0?`<div class="v2-benefits"><div><span>01</span><strong>See the bigger picture</strong><small>Cash flow, budgets, spending habits</small></div><div><span>02</span><strong>Stay in control</strong><small>On-device transaction history</small></div><div><span>03</span><strong>Ask Folio</strong><small>Simple financial guidance, in your words</small></div></div>`:''}
      ${stage===1?`<div class="v2-onboard-form">
        ${onboardingField('onb-balance','Current available balance (EGP)','e.g. 20000',state.reportedBalanceMinor?state.reportedBalanceMinor/100:'')}
        ${onboardingField('onb-income','Expected monthly income (EGP)','e.g. 15000',state.monthlyIncomeMinor?state.monthlyIncomeMinor/100:'')}
        ${onboardingField('onb-budget','Overall monthly spending target (EGP)','e.g. 5000',state.monthlyBudgetMinor?state.monthlyBudgetMinor/100:'')}
        <p>All values are optional. Your balance is a manual snapshot, not a bank connection.</p></div>`:''}
      ${stage===2?`<div class="v2-onboard-permission">
        <div class="v2-permission-title"><span>✦</span><div><strong>Financial notification recognition</strong><small>Optional · Android access</small></div></div>
        <p>When enabled, Folio reads notifications from approved apps on your device to detect payments and transfers. No raw notification messages are saved.</p>
        <div class="v2-permission-status"><span>${permissionStatus?'✓ Permission granted':'○ Permission not granted'}</span><span>${state.capture?'Monitoring enabled':'Monitoring off'}</span></div>
        <button class="v2-outline" type="button" onclick="FolioV2.optInCapture()">${permissionStatus?'Manage notification access':isPhone?'Continue to Android settings':'Available on Android only'}</button>
        <p class="v2-private-note">Android displays its own permission screen; Folio cannot replace it. Granting access is optional. You can turn it on later in Settings.</p>
      </div>`:''}
      ${stage===3?`<div class="v2-finish">
        <div><span>✓</span><strong>Private financial workspace</strong><small>Your records remain on this device.</small></div>
        <div><span>✓</span><strong>Folio Assistant</strong><small>Type or dictate finance updates for review.</small></div>
        <div><span>${permissionStatus?'✓':'○'}</span><strong>Automatic tracking</strong><small>${permissionStatus&&state.capture?'Enabled':'Optional — configure later in Settings'}</small></div>
      </div>`:''}
      <footer class="v2-onboard-footer"><div class="v2-action-line">${stage>0?`<button class="v2-back" onclick="FolioV2.previousStep()">Back</button>`:'<span></span>'}<button class="v2-next" onclick="FolioV2.${stage===3?'markReady()':'nextStep()'}">${stage===3?'Open Folio':'Continue'} <span>→</span></button></div><p>Private by default · No subscription required</p></footer>
    </div></div>`;
  }
  function assistantPage(){
    const stats=financeSummary();
    const snapshots=`<div class="v2-snapshots"><div><span>Available estimate</span><strong>${stats.balance===null?'Not set':money(stats.balance)}</strong></div><div><span>Monthly budget left</span><strong>${stats.remaining===null?'Not set':money(stats.remaining)}</strong></div><div><span>Expected income</span><strong>${state.monthlyIncomeMinor?money(state.monthlyIncomeMinor):'Not set'}</strong></div></div>`;
    const chat=`<div class="v2-chat" id="assistant-chat" role="log" aria-live="polite">${dialogue.length?dialogue.map(m=>`<div class="v2-bubble ${m.kind==='user'?'mine':'folio'}">${h(m.text)}</div>`).join(''):`<div class="v2-bubble folio">Hi! I'm Folio, your local financial planning assistant. ${h(speechHint())}</div>`}</div>`;
    return `${heading('FINANCIAL COMPANION','Ask Folio','Simple, transparent planning. You approve every change to your records.')}
      <div class="v2-assistant">${snapshots}
      <div class="v2-chat-shell">${chat}
      ${draft?`<div class="v2-action-review"><span>REVIEW BEFORE SAVING</span><strong>${h(draft.title)}</strong><div class="v2-action-line"><button onclick="FolioV2.cancelDraft()" class="v2-outline">Cancel</button><button onclick="FolioV2.applyDraft()" class="v2-next">Confirm & save</button></div></div>`:''}
      <div class="v2-compose"><textarea id="folio-assistant-input" rows="2" maxlength="500" placeholder="Ask about your money, or record a transaction..." aria-label="Message Folio"></textarea><div class="v2-compose-bottom"><div><button class="v2-mic" onclick="FolioV2.requestVoice()" title="Voice to text" aria-label="Voice to text">🎙 Voice</button><button class="v2-locale ${voiceLocale==='en-US'?'sel':''}" onclick="FolioV2.chooseLocale('en-US')">EN</button><button class="v2-locale ${voiceLocale==='ar-EG'?'sel':''}" onclick="FolioV2.chooseLocale('ar-EG')">AR</button></div><button class="v2-next" onclick="FolioV2.submitText()">Send ↗</button></div></div></div>
      <div class="v2-example-row"><button onclick="FolioV2.sendExample('I have 20000 in my bank')">Set my balance</button><button onclick="FolioV2.sendExample('My monthly budget is 5000')">Set a budget</button><button onclick="FolioV2.sendExample('How am I doing?')">Monthly overview</button><button onclick="FolioV2.sendExample('Can I afford 1500?')">Can I afford it?</button></div>
      <p class="v2-disclaimer">Folio's current assistant uses local rules, not a cloud AI model. Its calculations rely on your recorded data and may be incomplete. Verify balances and upcoming commitments before spending.</p></div>`;
  }
  function privacySheet(){
    return `<div class="v2-scrim" role="presentation"><section role="dialog" aria-modal="true" class="v2-privacy-sheet" aria-label="Speech input information">
    <button class="v2-close" aria-label="Close" onclick="FolioV2.closeSheet()">×</button>
    <span class="v2-eyebrow">VOICE INPUT</span><h2>Talk to Folio</h2><p>Android's speech recognition provider converts your voice into text. Depending on your device, audio may be processed online by that provider. Folio doesn't store the audio recording.</p>
    <p>Review the transcript and approve each proposed financial change before it is saved.</p>
    <button class="v2-next" onclick="FolioV2.beginVoice()">Continue with voice →</button><button class="v2-back" onclick="FolioV2.closeSheet()">Not now</button></section></div>`;
  }
  function render(){
    const root=$('root');if(!root)return;
    if(native() && typeof FolioNative.setDarkChrome==='function') FolioNative.setDarkChrome(!state.v2Onboarded);
    if(!state.v2Onboarded){root.innerHTML=onbHtml();document.body.classList.add('v2-onboarding');}
    else{document.body.classList.remove('v2-onboarding');root.innerHTML=shell(page==='assistant'?assistantPage():({overview,transactions,insights,budgets,settings})[page]());}
    let existing=$('v2-overlay');if(existing)existing.remove();
    if(showPrivacySheet){const overlay=document.createElement('div');overlay.id='v2-overlay';overlay.innerHTML=privacySheet();document.body.appendChild(overlay);}
  }
  // Upgrade old workspaces without changing historical transaction records or capture preferences.
  state.v2Onboarded=state.v2Onboarded===true;
  state.monthlyBudgetMinor=Number(state.monthlyBudgetMinor)||0;
  state.monthlyIncomeMinor=Number(state.monthlyIncomeMinor)||0;
  if(!Number.isFinite(state.reportedBalanceMinor))state.reportedBalanceMinor=null;
  if(!Number.isFinite(state.balanceReportedAt))state.balanceReportedAt=null;
  window.FolioV2={render,onbHtml,assistantPage,submitText,sendExample,planCommand,detectAmount,numberValue,applyDraft,cancelDraft,nextStep,previousStep,markReady,optInCapture,requestVoice,closeSheet,beginVoice,onVoiceResult,chooseLocale,explainAccess,estimatedBalance,financeSummary};
  window.folioGoHome=()=>{if(!state.v2Onboarded){previousStep();return;}onNav('overview');};
  render();
})();

/* </folio-inline:folio-v2.js> */
</script></body></html>
